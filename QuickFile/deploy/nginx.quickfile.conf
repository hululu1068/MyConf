# If uploads are large, consider setting client_body_temp_path to a larger disk.
client_max_body_size 0;
client_body_buffer_size 128k;

# Optional: direct entry point
location = /quickfile {
    rewrite ^ /quickfile/ last;
}

location ^~ /quickfile/ {
    set $qf_proto $scheme;
    set $qf_host $http_host;
    if ($http_x_forwarded_proto != "") {
        set $qf_proto $http_x_forwarded_proto;
    }
    if ($http_x_forwarded_host != "") {
        set $qf_host $http_x_forwarded_host;
    }

    if ($arg_host = "") {
        rewrite ^ /quickfile/?host=$qf_proto://$qf_host last;
    }

    proxy_cache off;
    proxy_redirect off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 300;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_set_header Host $qf_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://unix:/run/quickfile/quickfile.sock:;
}

location ^~ /quickfile/api/ {
    set $qf_proto $scheme;
    set $qf_host $http_host;
    if ($http_x_forwarded_proto != "") {
        set $qf_proto $http_x_forwarded_proto;
    }
    if ($http_x_forwarded_host != "") {
        set $qf_host $http_x_forwarded_host;
    }

    proxy_cache off;
    proxy_redirect off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 300;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_set_header Host $qf_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Keep behavior consistent with the OpenWrt package mapping.
    rewrite ^/quickfile/api/(.*) /api/$1?host=$qf_proto://$qf_host break;
    proxy_pass http://unix:/run/quickfile/quickfile.sock:/api/;
}

location ^~ /quickfile/static/ {
    set $qf_proto $scheme;
    set $qf_host $http_host;
    if ($http_x_forwarded_proto != "") {
        set $qf_proto $http_x_forwarded_proto;
    }
    if ($http_x_forwarded_host != "") {
        set $qf_host $http_x_forwarded_host;
    }

    proxy_set_header Host $qf_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    rewrite ^/quickfile/static/(.*) /static/$1?host=$qf_proto://$qf_host break;
    proxy_pass http://unix:/run/quickfile/quickfile.sock:/static/;
}
